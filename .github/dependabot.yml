version: 2
updates:
  - package-ecosystem: mix
    directory: "/"
    schedule:
      interval: daily
      time: "09:00"
    open-pull-requests-limit: 10
    versioning-strategy: lockfile-only
    cooldown:
      default-days: 7
  - package-ecosystem: npm
    directory: "/assets"
    schedule:
      interval: daily
      time: "09:00"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "phoenix"
      - dependency-name: "phoenix_html"
  - package-ecosystem: github-actions
    directories:
      - "/.github/workflows"
    schedule:
      interval: daily
      time: "09:00"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      github-actions-minor:
        update-types:
          - "patch"
          - "minor"