name: Deploy to Dev

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true

  workflow_dispatch:
    inputs:
      environment:
        type: environment
        required: true

jobs:
  fail_if_prod:
    name: "Fail if production environment"
    if: ${{ github.event.inputs.env || inputs.environment == 'production' }}
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Failing intentionally. Please use the production deployment workflow."
          exit 1
        shell: bash
  deploy:
    if: ${{ github.event.inputs.env || inputs.environment != 'production' }}
    name: "Deploy Alerts Manager dev"
    uses: ./.github/workflows/deploy-base.yml
    with:
      environment: ${{ github.event.inputs.env || inputs.environment }}
