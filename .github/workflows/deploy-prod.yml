name: Deploy to Prod

on:
  workflow_dispatch:
  release:
    types:
      - released

permissions: {}

jobs:
  deploy:
    name: "Deploy Alerts Manager production"
    uses: ./.github/workflows/deploy-base.yml
    with:
      environment: prod
    secrets: 
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      DOCKER_REPO: ${{ secrets.DOCKER_REPO }}
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}