name: Deploy on Push

permissions:
  id-token: write
  contents: read

on:
  push:
    branches: ["main"]

jobs:
    call-deploy-dev-green:
        uses: ./.github/workflows/deploy-dev.yml
        with:
          environment: dev-green
        secrets: inherit
    call-deploy-dev-orange:
        uses: ./.github/workflows/deploy-dev.yml
        with:
          environment: dev-orange
        secrets: inherit
    call-deploy-staging:
        uses: ./.github/workflows/deploy-dev.yml
        with:
          environment: staging
        secrets: inherit

