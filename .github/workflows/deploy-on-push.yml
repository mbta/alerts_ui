name: Deploy on Push

permissions:
  id-token: write
  contents: read

on:
  push:
    branches: ["main"]

jobs:
  call-deploy-dev-green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: ./.github/workflows/deploy-dev.yml
        with:
          environment: dev-green
  call-deploy-dev-orange:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: ./.github/workflows/deploy-dev.yml
        with:
          environment: dev-orange
