name: Deploy on Push

permissions: {}

on:
  push:
    branches: ["main"]

jobs:
    call-deploy-dev-orange:
        uses: ./.github/workflows/deploy-dev.yml
        with:
          environment: dev-orange
        permissions:
          id-token: write
          contents: read
        secrets: 
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
          DOCKER_REPO: ${{ secrets.DOCKER_REPO }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
    call-deploy-staging:
        uses: ./.github/workflows/deploy-dev.yml
        with:
          environment: staging
        permissions:
          id-token: write
          contents: read
        secrets: 
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
          DOCKER_REPO: ${{ secrets.DOCKER_REPO }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}

